# Serve o build do Vite (dist/) como SPA. Usado pelo Dockerfile (tickets 42 e 52).
#
# Este arquivo é um TEMPLATE: o Dockerfile roda `envsubst '${API_ORIGIN}'` nele no build da imagem.
# ${API_ORIGIN} vira a origem (esquema://host[:porta]) do build arg VITE_API_URL, para a CSP aceitar a API
# e as fotos de /uploads. As variáveis do próprio nginx ($uri, $request_id...) não são tocadas.

# /assets/* tem hash no nome: cache longo. O resto (index.html) é revalidado a cada acesso.
map $uri $sala_web_expira {
    ~^/assets/  1y;
    default     -1;
}

server {
    # Só IPv4: "listen [::]:80" derruba o nginx em máquinas com IPv6 desligado.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    expires $sala_web_expira;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP (ticket 52). Sem 'unsafe-inline': o FullCalendar 6 cria um <style data-fullcalendar> e só o
    # preenche se o <style> tiver o nonce lido de <meta name="csp-nonce"> (index.html). O nonce é o
    # $request_id (aleatório, 128 bits), novo a cada resposta, gravado no HTML pelo sub_filter abaixo.
    # Atributos style="" do React/FullCalendar entram via CSSOM (element.style), que a CSP não bloqueia.
    # font-src data: só por causa da fonte de ícones do FullCalendar (fcicons, embutida como data: no CSS dele).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' ${API_ORIGIN}; connect-src 'self' ${API_ORIGIN}; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Troca o marcador do index.html pelo nonce desta resposta (só text/html, o padrão do sub_filter).
    sub_filter '__CSP_NONCE__' '$request_id';
    sub_filter_once on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivo com extensão (ex.: /assets/index-abc.js, /favicon.svg): existe ou é 404.
    # Assim /src/main.jsx e afins nunca devolvem código-fonte nem caem no index.html.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # index.html carrega o nonce: sem ETag/Last-Modified não há 304, então o HTML em cache nunca fica com
    # um nonce diferente do cabeçalho CSP da resposta nova. (Sem add_header aqui: ele anularia os do server.)
    location = /index.html {
        etag off;
        if_modified_since off;
    }

    # Rotas do React Router (/agenda, /admin/ambientes...): fallback para o index.html.
    location / {
        try_files $uri /index.html;
    }
}
