# sala_web: sobe banco, backend e frontend.
# Uso: cp .env.example .env && docker compose up --build
# Decisão registrada em docs/adr/0001-stack-e-docker-compose.md

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sala_web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-sala_web}
      TZ: ${TZ:-America/Sao_Paulo}
    # Só no loopback da máquina (ticket 43): serve para rodar o backend fora do Docker na mesma máquina,
    # mas não fica acessível pela rede. O backend do Compose usa a rede interna (host "db").
    ports:
      - "127.0.0.1:${DB_PORTA_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sala_web} -d ${POSTGRES_DB:-sala_web}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sala_web}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sala_web}
      # Fotos antigas, só lidas pela importação ao subir (ADR-0010). As fotos novas ficam no banco.
      UPLOAD_DIR: /app/uploads
    # Sem PORT: o backend escuta em 8000 (no Render, na porta que ele definir; ADR-0009).
    ports:
      - "8000:8000"
    volumes:
      # Só leitura: a API não grava mais em disco; a montagem só serve para importar as fotos antigas.
      - uploads:/app/uploads:ro

  frontend:
    # Build de produção servido pelo nginx (ticket 42). VITE_* valem no build: mudou o .env,
    # rode "docker compose up --build". O dev server do Vite fica para o desenvolvimento local.
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_UPLOAD_MAX_MB: ${VITE_UPLOAD_MAX_MB:-${UPLOAD_MAX_MB:-5}}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  # Fotos gravadas em disco até a rodada 4. Continua declarado para não apagar dados de ninguém: só serve para a
  # importação (python -m app.importar_fotos, a cada subida do backend). Será retirado numa rodada futura; para
  # liberar o espaço antes disso, veja backend/README.md ("Fotos antigas").
  uploads:
