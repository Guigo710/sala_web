# Serve o build do Vite (dist/) como SPA. Usado pelo Dockerfile (ticket 42).

# /assets/* tem hash no nome: cache longo. O resto (index.html) é revalidado a cada acesso.
map $uri $sala_web_expira {
    ~^/assets/  1y;
    default     -1;
}

server {
    # Só IPv4: "listen [::]:80" derruba o nginx em máquinas com IPv6 desligado.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    expires $sala_web_expira;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivo com extensão (ex.: /assets/index-abc.js, /favicon.svg): existe ou é 404.
    # Assim /src/main.jsx e afins nunca devolvem código-fonte nem caem no index.html.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Rotas do React Router (/agenda, /admin/ambientes...): fallback para o index.html.
    location / {
        try_files $uri /index.html;
    }
}
