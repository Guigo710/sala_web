# CI do sala_web (ticket 28): testes do backend contra Postgres real, lint/test/build do frontend
# e o E2E com Playwright (frontend de produção + API + banco com seed).
# Só valores de teste aqui: nenhum segredo real.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: America/Sao_Paulo

jobs:
  backend:
    name: Backend (pytest + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sala_web
          POSTGRES_PASSWORD: sala_web
          POSTGRES_DB: sala_web_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sala_web -d sala_web_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://sala_web:sala_web@localhost:5432/sala_web_teste
      DATABASE_URL_TESTE: postgresql+psycopg://sala_web:sala_web@localhost:5432/sala_web_teste
      JWT_SECRET: segredo-de-teste-do-ci-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt; fi
      - name: Migrations (alembic upgrade head)
        run: alembic upgrade head
      - name: Testes
        run: python -m pytest -ra

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  e2e:
    name: E2E (Playwright, sistema real)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sala_web
          POSTGRES_PASSWORD: sala_web
          POSTGRES_DB: sala_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sala_web -d sala_web"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sala_web:sala_web@localhost:5432/sala_web
      JWT_SECRET: segredo-de-teste-do-ci-nao-usar-em-producao
      CORS_ORIGENS: http://localhost:5173
      UPLOAD_DIR: /tmp/sala_web_uploads
      ADMIN_RM: admin
      ADMIN_SENHA: senha-admin-do-ci
      E2E_ADMIN_RM: admin
      E2E_ADMIN_SENHA: senha-admin-do-ci
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Subir a API (migrations + seed + uvicorn)
        working-directory: backend
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt; fi
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8000/saude && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Subir o frontend (build de produção)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:5173/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/web.log; exit 1
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Logs e evidências
        if: always()
        run: |
          echo "--- API"; cat /tmp/api.log || true
          echo "--- Web"; cat /tmp/web.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidencias
          path: |
            frontend/test-results/
          retention-days: 7
